<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Bookmark Home</title>
    <link rel="stylesheet" href="./main.css" />
  </head>
  <body>
    <div id="app">
      <aside id="bookmark-sidebar" aria-label="Bookmarks">
        <header class="sidebar-header">
          <div class="sidebar-title">
            <span id="bookmark-count">0</span>
            <strong data-i18n="bookmarks">Bookmarks</strong>
          </div>
          <button
            id="toggle-bookmark-filter"
            class="icon-button"
            type="button"
            aria-label="Filter bookmarks"
            data-i18n-aria="filterBookmarks"
          >
            <span class="icon icon-search" aria-hidden="true"></span>
          </button>
          <button
            id="add-bookmark-item"
            class="icon-button"
            type="button"
            aria-label="Add bookmark or folder"
            data-i18n-aria="addBookmarkItem"
          >
            <span class="icon icon-add" aria-hidden="true"></span>
          </button>
          <button
            id="sidebar-menu"
            class="icon-button"
            type="button"
            aria-label="Menu"
            data-i18n-aria="menu"
          >
            <span class="icon icon-menu" aria-hidden="true"></span>
          </button>
        </header>
        <div class="sidebar-tools" hidden>
          <label class="bookmark-filter">
            <span class="icon icon-search" aria-hidden="true"></span>
            <input
              id="bookmark-filter"
              type="search"
              autocomplete="off"
              spellcheck="false"
              placeholder="Filter bookmarks"
              data-i18n-placeholder="filterBookmarks"
            />
          </label>
          <button
            id="close-bookmark-filter"
            class="icon-button"
            type="button"
            aria-label="Close"
            data-i18n-aria="cancel"
          >
            <span aria-hidden="true">×</span>
          </button>
        </div>
        <div
          id="bookmark-tree"
          class="tree-viewport"
          role="tree"
          tabindex="0"
          aria-label="Bookmark tree"
          data-i18n-aria="bookmarkTree"
        >
          <div id="tree-spacer">
            <div id="tree-content"></div>
          </div>
          <div id="tree-empty" class="empty-state" hidden></div>
        </div>
        <div
          id="sidebar-resize"
          role="separator"
          aria-orientation="vertical"
        ></div>
      </aside>

      <button
        id="open-sidebar"
        class="sidebar-rail-button"
        type="button"
        aria-label="Open bookmarks"
        data-i18n-aria="openBookmarks"
      >
        <span aria-hidden="true">›</span>
      </button>

      <main id="home">
        <section class="search-stage">
          <form id="web-search" role="search">
            <input
              id="web-search-input"
              type="text"
              autocomplete="off"
              spellcheck="false"
              placeholder="Search Google or enter an address"
            />
            <button type="submit" aria-label="Search" data-i18n-aria="search">
              <span class="icon icon-search" aria-hidden="true"></span>
            </button>
            <ul id="search-suggestions" role="listbox" hidden></ul>
          </form>
        </section>
        <button
          id="edit-home"
          class="edit-home-button"
          type="button"
          aria-label="Edit home"
          data-i18n-aria="editHome"
        >
          <span class="icon icon-edit" aria-hidden="true"></span>
        </button>
      </main>
    </div>

    <div id="popover-root"></div>
    <div id="dialog-root"></div>
    <div id="settings-root"></div>
    <div id="home-editor-root"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
